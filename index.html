<script>
const p="https://corsproxy.io/?url=", k="02423D0994272512ABA293EB60911362", a=new URLSearchParams(location.search).get('appid')||'4756630'; fetch(p+encodeURIComponent(`https://api.steampowered.com/IInventoryService/GetItemDefMeta/v1/?key=${k}&appid=${a}`)).then(r=>r.json()).then(m=>{ if(!m?.response?.digest) throw new Error('Steam/Proxy Yanıtı: '+JSON.stringify(m)); return fetch(p+encodeURIComponent(`https://api.steampowered.com/IGameInventory/GetItemDefArchive/v1/?appid=${a}&digest=${m.response.digest}`)); }).then(r=>r.text()).then(t=>document.body.innerHTML=JSON.parse(t.replace(/\0/g,'')).map(i=>`<p><b>${i.name}</b> | Sabit Fiyat: ${(i.price||i.price_category)?`${i.price||i.price_category} (<a href="https://store.steampowered.com/buyitem/${i.appid}/${i.itemdefid}" target="_blank">Satın Al</a>)`:'Yok'} | ${i.marketable?`<a href="https://steamcommunity.com/market/listings/${i.appid}/${encodeURIComponent(i.market_hash_name||i.name)}" target="_blank">Pazar Linki</a>`:'Pazarlanamaz'}</p>`).join('')).catch(e=>document.body.innerHTML='Hata: '+e);
</script>
