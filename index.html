<script>
document.write('<div style="font-family:sans-serif;margin-bottom:14px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="a" placeholder="App ID" value="'+(new URLSearchParams(location.search).get('appid')||'4756630')+'" style="width:90px;padding:6px 10px"><input id="k" placeholder="Steam Web API Key" value="'+(new URLSearchParams(location.search).get('key')||'02423D0994272512ABA293EB60911362')+'" style="width:260px;padding:6px 10px"><input id="cp" placeholder="CORS Proxy Key" value="'+(new URLSearchParams(location.search).get('corskey')||'2522119a')+'" style="width:130px;padding:6px 10px"><button onclick="go()" style="padding:6px 14px;cursor:pointer">Check</button></div><div style="margin-top:6px;font-size:12px;display:flex;gap:14px"><a href="https://steamcommunity.com/dev/apikey" target="_blank">Get Steam Web API Key</a><a href="https://console.corsproxy.io/" target="_blank">Get CORS Proxy Key</a></div></div><table id="t" style="border-collapse:collapse;font-family:sans-serif"></table>'); function go(){ const cp=document.getElementById('cp').value.trim(), k=document.getElementById('k').value.trim(), a=document.getElementById('a').value.trim(), t=document.getElementById('t'); const p="https://corsproxy.io/?key="+cp+"&url="; t.innerHTML='<tr><td>Loading...</td></tr>'; fetch(p+encodeURIComponent(`https://api.steampowered.com/IInventoryService/GetItemDefMeta/v1/?key=${k}&appid=${a}`)).then(r=>r.json()).then(m=>{ if(!m?.response?.digest) throw new Error('Steam/Proxy: '+JSON.stringify(m)); return fetch(p+encodeURIComponent(`https://api.steampowered.com/IGameInventory/GetItemDefArchive/v1/?appid=${a}&digest=${m.response.digest}`)); }).then(r=>r.text()).then(raw=>t.innerHTML=JSON.parse(raw.replace(/\0/g,'')).map(i=>`<tr><td style="padding:4px 16px 4px 0"><b>${i.name}</b></td><td style="padding:4px 16px">Price: ${(i.price||i.price_category)?`${i.price||i.price_category} (<a href="https://store.steampowered.com/buyitem/${i.appid}/${i.itemdefid}" target="_blank">Buy</a>)`:'None'}</td><td style="padding:4px 16px">${i.marketable?`<a href="https://steamcommunity.com/market/listings/${i.appid}/${encodeURIComponent(i.market_hash_name||i.name)}" target="_blank">Market Link</a>`:'Not Marketable'}</td></tr>`).join('')).catch(e=>t.innerHTML='<tr><td style="color:red">Error: '+e+'</td></tr>'); } go();
</script>
