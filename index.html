<script>
    document.write('<div style="font-family:sans-serif;margin-bottom:14px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="a" placeholder="App ID" value="' + (new URLSearchParams(location.search).get('appid') || '') + '" style="width:90px;padding:6px 10px"><input id="k" placeholder="Steam Web API Key" value="' + (new URLSearchParams(location.search).get('key') || '') + '" style="width:260px;padding:6px 10px"><button id="b" onclick="go()" style="padding:6px 14px;cursor:pointer">Check</button></div><div style="margin-top:6px;font-size:12px;display:flex;gap:14px"><a href="https://steamcommunity.com/dev/apikey" target="_blank">Get Steam Web API Key</a><span style="color:#2ea043;font-weight:600">⚡ Cloudflare Proxy Active</span></div></div><table id="t" style="border-collapse:collapse;font-family:sans-serif"></table>'); const cache = {}; async function checkedFetch(url, stage) { let response; try { response = await fetch(url, { signal: AbortSignal.timeout(15000) }); } catch (error) { throw new Error(`${stage}: ${error.name} — ${error.message}`); } if (!response.ok) { throw new Error(`${stage}: HTTP ${response.status}`); } return response; } async function go() { const k = document.getElementById('k').value.trim(), a = document.getElementById('a').value.trim(), t = document.getElementById('t'), b = document.getElementById('b'); if (!a || !k) { alert('Please enter App ID and Steam Web API Key'); return; } b.disabled = true; t.innerHTML = '<tr><td>Loading...</td></tr>'; const p = "https://stmdb.alperugurcan.workers.dev/?url="; try { const metaRes = await checkedFetch(p + encodeURIComponent(`https://api.steampowered.com/IInventoryService/GetItemDefMeta/v1/?key=${k}&appid=${a}`), 'Metadata'); const m = await metaRes.json(); if (!m?.response?.digest) throw new Error('Metadata: No digest in response ' + JSON.stringify(m)); const d = m.response.digest, ck = a + '_' + d; let items = cache[ck]; if (!items) { const arcRes = await checkedFetch(p + encodeURIComponent(`https://api.steampowered.com/IGameInventory/GetItemDefArchive/v1/?appid=${a}&digest=${d}`), 'Archive'); const raw = await arcRes.text(); items = JSON.parse(raw.replace(/\0/g, '')); cache[ck] = items; } const isM = v => v === true || v === 1 || v === '1'; const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); t.innerHTML = items.map(i => `<tr><td style="padding:4px 16px 4px 0"><b>${esc(i.name)}</b></td><td style="padding:4px 16px">Price: ${(i.price || i.price_category) ? `${esc(i.price || i.price_category)} (<a href="https://store.steampowered.com/buyitem/${encodeURIComponent(i.appid || a)}/${encodeURIComponent(i.itemdefid)}" target="_blank">Buy</a>)` : 'None'}</td><td style="padding:4px 16px">${isM(i.marketable) ? `<a href="https://steamcommunity.com/market/listings/${encodeURIComponent(i.appid || a)}/${encodeURIComponent(i.market_hash_name || i.name)}" target="_blank">Market Link</a>` : 'Not Marketable'}</td></tr>`).join(''); } catch (e) { t.innerHTML = `<tr><td style="color:red">Error: ${String(e.message || e).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</td></tr>`; } finally { b.disabled = false; } }
</script>
